name: Capture authentic app screenshots
on:
  push:
    branches: [docs/visual-readme-20261123]
    paths: [.github/workflows/capture-readme.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Vite app and install screenshot helper
        run: |
          npm ci
          npm install --no-save --no-package-lock puppeteer-core@24
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 2; done
      - name: Capture graph and timeline
        run: |
          mkdir -p docs/screenshots
          node <<'NODE'
          const p=require('puppeteer-core');
          (async()=>{
            const browser=await p.launch({headless:true,executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(); await page.setViewport({width:1600,height:940,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:5173/',{waitUntil:'networkidle2'});
            await page.waitForSelector('.timeline-slider',{timeout:20000});
            await new Promise(r=>setTimeout(r,4500));
            await page.screenshot({path:'docs/screenshots/character-network.png'});
            await page.evaluate(()=>{const el=document.querySelector('.timeline-slider');el.value='7';el.dispatchEvent(new Event('input',{bubbles:true}));const descriptor=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value'); descriptor.set.call(el,'7');el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});
            await new Promise(r=>setTimeout(r,4000));
            const year=await page.$eval('.timeline-year-badge',el=>el.textContent);
            if(!year.includes('7'))throw new Error('Timeline failed to advance: '+year);
            await page.screenshot({path:'docs/screenshots/book-seven-network.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          file docs/screenshots/*.png
      - name: Commit screenshot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: add authentic browser screenshots for README"
          git push origin HEAD:docs/visual-readme-20261123
